name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AjazzCtl.csproj

      - name: Build (Release)
        run: dotnet build AjazzCtl.csproj -c Release --no-restore

      - name: Run self-tests
        run: dotnet run --project AjazzCtl.csproj -c Release --no-build -- test
